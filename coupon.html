<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Coupon</title>
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32">
  <!-- RRA-151: the page a coupon's QR code opens on any phone. It shows the
       offer words carried in the link and the code to show the server. It
       holds no app data: the POS looks the real offer up from the code, so a
       changed link can't change the discount. Names come from js/brand.js. -->
  <script src="js/brand.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f2f2f7; color: #111; font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; display: flex; align-items: flex-start; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 16px 32px; }
    .card { width: 100%; max-width: 420px; background: #fff; border: 6px solid #000; outline: 2px solid #000; outline-offset: -14px; border-radius: 4px; padding: 28px 26px 24px; text-align: center; }
    .logo { max-width: 180px; max-height: 90px; display: block; margin: 0 auto 8px; }
    .title { font-size: 30px; letter-spacing: .3em; margin: 4px 0 0; text-transform: none; }
    .tagline { margin: 2px 0 18px; font-size: 18px; color: #333; }
    .head { font-size: 28px; font-weight: 800; line-height: 1.2; margin: 6px 0 12px; }
    .fine { list-style: none; padding: 0; margin: 0 0 18px; color: #333; font-size: 16px; }
    .fine li { margin: 3px 0; }
    .code { display: inline-block; font: 700 26px ui-monospace, Menlo, "Courier New", monospace; letter-spacing: .06em; border: 2px dashed #000; border-radius: 8px; padding: 10px 16px; margin: 4px 0 10px; word-break: break-all; }
    .show { font-weight: 600; margin: 6px 0 14px; }
    .note { font-size: 13px; color: #666; margin: 14px 0 0; }
    .bad { color: #b00020; font-weight: 600; }
  </style>
</head>
<body>
  <main class="card" id="card">
    <img class="logo" id="logo" alt="" hidden>
    <h1 class="title" id="title"></h1>
    <p class="tagline" id="tagline"></p>
    <div id="offer"></div>
  </main>
  <script>
    (function () {
      var B = self.BRAND || {}, C = B.coupon || {};
      var $ = function (id) { return document.getElementById(id); };
      var el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; e.textContent = text; return e; };
      document.title = (C.title || B.shortName || 'Coupon') + ' coupon';
      $('title').textContent = C.title || B.shortName || '';
      $('tagline').textContent = C.tagline || '';
      if (B.logo) { $('logo').src = B.logo; $('logo').hidden = false; $('logo').onerror = function () { this.hidden = true; }; }
      var h = location.hash.replace(/^#/, ''), q = new URLSearchParams(h);
      // Old coupons and plain links: #BLG:WINGS20
      var raw = q.get('c') || (/^[A-Za-z0-9]+:[A-Za-z0-9-]+$/.test(h) ? h : '');
      var code = (raw.split(':')[1] || '').toUpperCase().replace(/[^A-Z0-9-]/g, '');
      var box = $('offer');
      if (!code) { box.appendChild(el('p', 'bad', "This coupon link isn't complete. Ask your server for help.")); return; }
      box.appendChild(el('p', 'head', (q.get('h') || 'Special offer').slice(0, 120)));
      var fine = (q.get('f') || '').split('|').filter(Boolean).slice(0, 8);
      if (fine.length) { var ul = el('ul', 'fine', ''); fine.forEach(function (t) { ul.appendChild(el('li', '', t.slice(0, 120))); }); box.appendChild(ul); }
      box.appendChild(el('p', 'show', 'Show this to your server'));
      box.appendChild(el('div', 'code', code));
      box.appendChild(el('p', 'note', 'Your server scans or types this code. The offer is checked when it is used.'));
    })();
  </script>
</body>
</html>
